name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Оффлайн-проверка сборки запросов
        run: python3 skills/threads-publishing/scripts/threads.py selftest
      - name: Проверка боевого пути публикации (HTTP замокан)
        run: python3 tests/test_publish_flow.py
